<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figure</title>
  <link rel="stylesheet" href="figure.css">
</head>
<body>
  <div id="stage"><div id="card"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="toolbar" role="toolbar">
    <button type="button" data-cmd="zoom-out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <button type="button" data-cmd="actual" id="zoom-label">100%</button>
    <button type="button" data-cmd="zoom-in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-cmd="fit"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.75 6V2.75H6M10 2.75h3.25V6M13.25 10v3.25H10M6 13.25H2.75V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-cmd="copy"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.25" y="5.25" width="8.25" height="8.25" rx="1.75" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 2.75H4.25a1.5 1.5 0 0 0-1.5 1.5v6.25" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button type="button" data-cmd="save"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M4.75 7 8 10.25 11.25 7M3 12.75h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <script src="figure.js"></script>
</body>
</html>
